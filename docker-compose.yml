services:
  monitor:
    build:
      context: ./monitoring/ubuntu-monitor
    restart: always
    volumes:
      - ./logs:/var/log

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
