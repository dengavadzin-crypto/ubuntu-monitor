name: Docker Build Check

on:
  push:
    branches:
      - ubuntu-monitor

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: shellcheck ./ubuntu-monitor/sys_stat.sh

      - name: Build Docker image
        run: docker build -t ubuntu-monitor ./ubuntu-monitor
